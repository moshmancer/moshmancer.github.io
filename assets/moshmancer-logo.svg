<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
    <filter id="cg" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1624" height="1624">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cgt" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1624" height="1624">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 背景渐变（原始代码雨） -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>

    <!-- 扫描线 -->
    <pattern id="scan" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.3" fill="#000" opacity="0.22"/>
    </pattern>

    <!-- 灰格（明显可见，与原始代码雨一致） -->
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse" x="204" y="204">
      <rect width="76" height="76" rx="14" fill="#1C1F26"/>
    </pattern>

    <!-- 横向渐变（变体11用） -->
    <linearGradient id="gradMix" gradientUnits="userSpaceOnUse" x1="204" y1="0" x2="820" y2="0">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FF9F"/>
    </linearGradient>

    <!-- 环境光晕 -->
    <radialGradient id="rg1"><stop offset="0%" stop-color="#39FF14" stop-opacity=".10"/><stop offset="100%" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg4"><stop offset="0%" stop-color="#33FF33" stop-opacity=".10"/><stop offset="100%" stop-color="#33FF33" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg5"><stop offset="0%" stop-color="#00FF9F" stop-opacity=".10"/><stop offset="100%" stop-color="#00FF9F" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg6"><stop offset="0%" stop-color="#00FF41" stop-opacity=".10"/><stop offset="100%" stop-color="#00FF41" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg9"><stop offset="0%" stop-color="#0FF0FC" stop-opacity=".10"/><stop offset="100%" stop-color="#0FF0FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg10"><stop offset="0%" stop-color="#BFFF00" stop-opacity=".10"/><stop offset="100%" stop-color="#BFFF00" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#rg1)"/>
  <rect x="100" y="100" width="824" height="824" rx="60" fill="none" stroke="#39FF14" stroke-width="4" opacity=".30"/>
  <rect x="118" y="118" width="788" height="788" rx="52" fill="none" stroke="#39FF14" stroke-width="1.5" opacity=".14"/>
  <rect x="204" y="204" width="616" height="616" fill="url(#grid)"/>
  <g fill="#39FF14" filter="url(#cg)">
    <rect x="204" y="204" width="76" height="76" rx="14"/><rect x="744" y="204" width="76" height="76" rx="14"/>
    <rect x="204" y="294" width="76" height="76" rx="14"/><rect x="294" y="294" width="76" height="76" rx="14"/>
    <rect x="654" y="294" width="76" height="76" rx="14"/><rect x="744" y="294" width="76" height="76" rx="14"/>
    <rect x="204" y="384" width="76" height="76" rx="14"/><rect x="384" y="384" width="76" height="76" rx="14"/>
    <rect x="564" y="384" width="76" height="76" rx="14"/><rect x="744" y="384" width="76" height="76" rx="14"/>
    <rect x="204" y="474" width="76" height="76" rx="14"/><rect x="474" y="474" width="76" height="76" rx="14"/>
    <rect x="744" y="474" width="76" height="76" rx="14"/>
    <rect x="204" y="564" width="76" height="76" rx="14"/><rect x="744" y="564" width="76" height="76" rx="14"/>
    <rect x="204" y="654" width="76" height="76" rx="14"/><rect x="744" y="654" width="76" height="76" rx="14"/>
    <rect x="204" y="744" width="76" height="76" rx="14"/><rect x="744" y="744" width="76" height="76" rx="14"/>
  </g>
  <rect x="120" y="120" width="784" height="784" rx="50" fill="url(#scan)"/>
  <rect x="700" y="852" width="64" height="14" fill="#39FF14" filter="url(#cgt)"/>

</svg>